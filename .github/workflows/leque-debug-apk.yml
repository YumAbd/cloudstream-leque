name: Build CloudXtream V5.0.9 Activation Fix Preview APK
run-name: CloudXtream preview ${{ inputs.upstream_sha || '5024ace2922a148d38df2a816b483b529789cf58' }} - event ${{ inputs.maintenance_event_id || 'manual' }}
on:
  push:
    branches: [apk-build]
    paths:
      - '.github/workflows/leque-debug-apk.yml'
      - 'leque/**'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: Official recloustream/cloudstream commit SHA (40 lowercase hex)
        required: false
        type: string
        default: '5024ace2922a148d38df2a816b483b529789cf58'
      maintenance_event_id:
        description: Telegram approved D1 event UUID (for audit only)
        required: false
        type: string
        default: manual

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK from GitHub runner and install API 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-37.0'
          test -d "$SDK_ROOT/platforms/android-37.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Download official CloudStream (pinned approved SHA)
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha || '5024ace2922a148d38df2a816b483b529789cf58' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'FAIL: invalid official SHA'; exit 1; }
          git clone --quiet --depth 1 --branch master https://github.com/recloudstream/cloudstream.git upstream
          git -C upstream fetch --quiet --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --quiet --detach "$UPSTREAM_SHA"
          ACTUAL="$(git -C upstream rev-parse HEAD)"
          test "$ACTUAL" = "$UPSTREAM_SHA"
          echo "Official CloudStream commit: $ACTUAL"
          echo "Preview only: debug APK uses runner-local signing, NOT an OTA release."
      - name: Validate curated catalog and pinned PMSM when present
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path("sumber.json").read_text(encoding="utf-8"))
          assert 1 <= len(catalog) <= 80, len(catalog)
          active=[p for p in catalog if p["status"]==1]
          assert len(active)>=1, len(active)
          assert len({p["internalName"] for p in catalog})==len(catalog)
          assert all(isinstance(p["status"], int) and 0 <= p["status"] <= 10 for p in catalog)
          item=next((p for p in active if p["internalName"]=="Pmsm"),None)
          if item:
              assert item["version"]==4
              assert item["url"]=="https://raw.githubusercontent.com/mahmoodnizamani94-png/cloudstream-extensions-phisher/builds/Pmsm.cs3"
              assert item["fileHash"]=="sha256-d145f31834487e2fe511c14857b39475e107d44725f57f805b830765af196253"
          repo=json.loads(Path("repo.json").read_text(encoding="utf-8"))
          assert repo["pluginLists"]==["https://raw.githubusercontent.com/YumAbd/cloudstream-leque/apk-build/sumber.json"]
          print("PASS: catalog and PMSM fork metadata pinned")
          PY
      - name: Validate alternative PMSM download SHA256
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/Pmsm.cs3 https://raw.githubusercontent.com/mahmoodnizamani94-png/cloudstream-extensions-phisher/builds/Pmsm.cs3
          echo 'd145f31834487e2fe511c14857b39475e107d44725f57f805b830765af196253  /tmp/Pmsm.cs3' | sha256sum -c -
      - name: Prepare logo renderer
        run: |
          python3 -m venv .leque-icon-venv
          .leque-icon-venv/bin/python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Apply Leque customization
        run: |
          python3 leque/customize.py upstream
          python3 leque/customize_v52.py upstream
          python3 leque/customize_v53.py upstream
          python3 leque/enable_activation_v54.py upstream
          python3 leque/fix_activation_v55.py upstream
          python3 leque/fix_activation_v56.py upstream
          python3 leque/catalog_sync_v57.py upstream
          python3 leque/smart_play_v58.py upstream
          python3 leque/app_update_v59.py upstream
          .leque-icon-venv/bin/python leque/apply_branding.py upstream
          git -C upstream add -N app/src/main/java/com/lagradost/cloudstream3/activation/CxWorkerActivation.kt app/src/main/java/com/lagradost/cloudstream3/activation/CxActivationActivity.kt app/src/androidTest/java/com/lagradost/cloudstream3/activation/CxKeystoreProofTest.kt
          git -C upstream diff --check
      - name: Compile Android debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableDebug
      - name: Compile Android 8 instrumentation test APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableDebugAndroidTest
          find app/build/outputs/apk/androidTest -type f -name '*.apk' -size +1k | grep -q .
      - name: Collect APK and patch
        run: |
          mkdir -p out
          find upstream/app/build/outputs/apk/stable/debug -type f -name '*.apk' -exec cp {} out/CloudXtream-by-Leque-v5.0.9-ActivationFixPreview.apk \;
          test -s out/CloudXtream-by-Leque-v5.0.9-ActivationFixPreview.apk
          git -C upstream diff --binary > out/CloudXtream-V5.0.9-ActivationFixPreview-source.patch
          cp upstream/LICENSE out/CloudStream-GPL-3.0-LICENSE.txt
          sha256sum out/CloudXtream-by-Leque-v5.0.9-ActivationFixPreview.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt
      - name: Capture debug APK signing certificate (not for OTA deployment)
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          if ! "$APKSIGNER" verify --min-sdk-version 23 --print-certs --verbose out/CloudXtream-by-Leque-v5.0.9-ActivationFixPreview.apk > out/apk-signing-certificate.txt 2>&1; then
            echo 'FAIL: APK signature verification failed; diagnostic output follows'
            cat out/apk-signing-certificate.txt
            exit 1
          fi
          cat out/apk-signing-certificate.txt
          if ! grep -E '^(V[234] Signer|Signer #1): certificate SHA-256 digest: [a-f0-9]{64}$' out/apk-signing-certificate.txt; then
            echo 'FAIL: Cannot extract signer SHA-256 fingerprint'
            exit 1
          fi
      - name: Upload Leque debug build
        uses: actions/upload-artifact@v7
        with:
          name: CloudXtream-by-Leque-v5.0.9-ActivationFixPreview
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Verify minSdk is Android 8 compatible
        run: |
          APK=out/CloudXtream-by-Leque-v5.0.9-ActivationFixPreview.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > out/apk-badging.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" out/apk-badging.txt
          MIN_SDK="$(sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p" out/apk-badging.txt)"
          test -n "$MIN_SDK"
          test "$MIN_SDK" -le 26
          grep "package: name='com.leque.cloudstreamv5.debug.activationfix'" out/apk-badging.txt
      - name: Enable KVM for Android 8 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Leque on Android 8.0 API 26 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "26"
            adb logcat -c || true
            adb install -r out/CloudXtream-by-Leque-v5.0.9-ActivationFixPreview.apk
            test -n "$(find upstream/app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)"
            adb install -r "$(find upstream/app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)"
            adb shell am instrument -w -e class com.lagradost.cloudstream3.activation.CxKeystoreProofTest com.leque.cloudstreamv5.debug.activationfix.test/androidx.test.runner.AndroidJUnitRunner > out/api26-keystore-test.txt
            cat out/api26-keystore-test.txt
            grep -q 'OK (1 test)' out/api26-keystore-test.txt || { echo 'FAIL: Android 8 real Keystore proof failed'; exit 1; }
            adb shell am start -W -n com.leque.cloudstreamv5.debug.activationfix/com.lagradost.cloudstream3.ui.account.AccountSelectActivity2
            sleep 22
            adb shell pidof com.leque.cloudstreamv5.debug.activationfix > out/api26-process.txt
            adb logcat -d -b crash > out/api26-crashes.txt || true
            adb logcat -d -s LequePluginSync:I > out/api26-plugin-sync.txt || true
            if grep -q 'Process: com.leque.cloudstreamv5.debug.activationfix' out/api26-crashes.txt; then echo 'FAIL: Android 8 app crash'; exit 1; fi
            adb shell dumpsys activity activities > out/api26-activities.txt
            adb shell uiautomator dump /sdcard/cx-activation-ui.xml || true
            adb pull /sdcard/cx-activation-ui.xml out/api26-activation-ui.xml || true
            grep -q 'CxActivationActivity' out/api26-activities.txt || { echo 'FAIL: expected activation screen on Android 8'; exit 1; }
            adb shell screencap -p /sdcard/leque-android8.png || true
            adb pull /sdcard/leque-android8.png out/api26-screenshot.png || true
            echo 'PASS: installed and running on Android 8.0 API 26 without fatal exception'
      - name: Upload Android 8 verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CloudXtream-Leque-v5.0.9-ActivationFixPreview-Android8-Evidence
          path: |
            out/apk-badging.txt
            out/api26-process.txt
            out/api26-crashes.txt
            out/api26-activities.txt
            out/api26-plugin-sync.txt
            out/api26-screenshot.png
            out/api26-activation-ui.xml
            out/api26-keystore-test.txt
          if-no-files-found: warn
          retention-days: 14
