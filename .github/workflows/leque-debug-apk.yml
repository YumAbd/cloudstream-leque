name: Build CloudStream by Leque Debug APK
on:
  push:
    branches: [apk-build]
    paths:
      - '.github/workflows/leque-debug-apk.yml'
      - 'leque/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK from GitHub runner and install API 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-37.0'
          test -d "$SDK_ROOT/platforms/android-37.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Download official CloudStream (pinned)
        run: |
          git clone --quiet --depth 1 --branch master https://github.com/recloudstream/cloudstream.git upstream
          git -C upstream fetch --quiet --depth 1 origin 5024ace2922a148d38df2a816b483b529789cf58
          git -C upstream checkout --quiet --detach 5024ace2922a148d38df2a816b483b529789cf58
      - name: Apply Leque customization
        run: |
          python3 leque/customize.py upstream
          python3 leque/customize_v51.py upstream
          git -C upstream diff --check
      - name: Compile Android debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableDebug
      - name: Collect APK and patch
        run: |
          mkdir -p out
          find upstream/app/build/outputs/apk/stable/debug -type f -name '*.apk' -exec cp {} out/CloudStream-by-Leque-v5.0.1-Debug.apk \;
          test -s out/CloudStream-by-Leque-v5.0.1-Debug.apk
          git -C upstream diff --binary > out/Leque-V5-source.patch
          cp upstream/LICENSE out/CloudStream-GPL-3.0-LICENSE.txt
          sha256sum out/CloudStream-by-Leque-v5.0.1-Debug.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt
      - name: Upload Leque debug build
        uses: actions/upload-artifact@v7
        with:
          name: CloudStream-by-Leque-v5.0.1-Debug
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Verify minSdk is Android 8 compatible
        run: |
          APK=out/CloudStream-by-Leque-v5.0.1-Debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > out/apk-badging.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" out/apk-badging.txt
          MIN_SDK="$(sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p" out/apk-badging.txt)"
          test -n "$MIN_SDK"
          test "$MIN_SDK" -le 26
          grep "package: name='com.leque.cloudstreamv5.debug'" out/apk-badging.txt
      - name: Enable KVM for Android 8 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Leque on Android 8.0 API 26 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "26"
            adb logcat -c || true
            adb install -r out/CloudStream-by-Leque-v5.0.1-Debug.apk
            adb shell am start -W -n com.leque.cloudstreamv5.debug/com.lagradost.cloudstream3.ui.account.AccountSelectActivity2
            sleep 22
            adb shell pidof com.leque.cloudstreamv5.debug > out/api26-process.txt
            adb logcat -d -b crash > out/api26-crashes.txt || true
            if grep -q 'Process: com.leque.cloudstreamv5.debug' out/api26-crashes.txt; then echo 'FAIL: Android 8 app crash'; exit 1; fi
            adb shell dumpsys activity activities > out/api26-activities.txt
            adb shell screencap -p /sdcard/leque-android8.png || true
            adb pull /sdcard/leque-android8.png out/api26-screenshot.png || true
            echo 'PASS: installed and running on Android 8.0 API 26 without fatal exception'
      - name: Upload Android 8 verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CloudStream-Leque-v5.0.1-Android8-Evidence
          path: |
            out/apk-badging.txt
            out/api26-process.txt
            out/api26-crashes.txt
            out/api26-activities.txt
            out/api26-screenshot.png
          if-no-files-found: warn
          retention-days: 14
